# 관측성 스택 — 앱(docker-compose.yml)과 라이프사이클을 분리한 별도 프로젝트.
# 앱 배포가 이 스택을 재시작하지 않고, 이 스택 변경(알림 규칙 등)도 앱을 건드리지 않는다.
#
# 기동(최초 1회 네트워크/볼륨 부트스트랩 필요):
#   docker network create endurohub_obs        # 앱↔관측성 공유 네트워크
#   docker volume  create endurohub_nginx_logs # nginx 로그 공유 볼륨(앱의 nginx 가 기록, promtail 이 읽음)
#   docker compose -f docker-compose.observability.yml up -d
#
# 앱 compose 는 위 네트워크/볼륨을 external 로 참조한다.
name: endurohub-obs

services:
  # ── LGTM 올인원: OTel Collector + Loki + Tempo + Prometheus + Grafana ──
  lgtm:
    image: grafana/otel-lgtm:latest
    # 안전 상한(격벽): 관측성 스택이 호스트 메모리를 잠식해 앱을 OOM 시키지 못하게 한다.
    mem_limit: 3g
    ports:
      - "3001:3000"      # Grafana UI (host 3001 → 앱 web 이 3000 점유하므로 분리)
    environment:
      # Grafana 알림 contact point(Telegram)용 — provisioning 파일에서 ${...} 로 보간.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      # 데이터 영속화. 미마운트 시 컨테이너 재시작마다 메트릭/로그/트레이스 소실.
      - lgtm_data:/data
      # Grafana 알림 프로비저닝(contact point/policy/rules). alerting 서브디렉터리만 마운트해
      # 이미지 기본 datasource/dashboard provisioning 은 건드리지 않는다.
      - ./monitoring/grafana/provisioning/alerting:/otel-lgtm/grafana/conf/provisioning/alerting:ro
      # 커스텀 대시보드 프로바이더 + JSON. 이미지 기본 dashboard provider 와 공존하도록
      # provider 파일 1개만 추가 마운트하고, JSON 은 별도 경로에서 로드한다.
      - ./monitoring/grafana/provisioning/dashboards/endurohub.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/endurohub.yaml:ro
      - ./monitoring/grafana/dashboards:/etc/grafana-dashboards-endurohub:ro
    restart: unless-stopped

  # nginx JSON access log → Loki 수집기. 앱 로그는 OTLP 로 직접 전송하므로 nginx 전용.
  promtail:
    image: grafana/promtail:latest
    mem_limit: 256m
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - nginx_logs:/var/log/nginx:ro
    depends_on:
      - lgtm
    restart: unless-stopped

  # 컨테이너 CPU/메모리(docker_stats) + 호스트 디스크(hostmetrics) → OTLP → lgtm.
  otelcol:
    image: otel/opentelemetry-collector-contrib:latest
    mem_limit: 512m
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    # docker.sock 접근 권한(root:docker, 660). 소켓 마운트 자체가 root 권한급이므로 동일 신뢰수준.
    # distroless 이미지라 /etc/passwd 가 없어 이름("root") 해석 불가 → 숫자 UID:GID 로 지정.
    user: "0:0"
    environment:
      # redis receiver 인증용 — 앱 compose 와 동일한 기본값/주입 방식.
      REDIS_PASSWORD: ${REDIS_PASSWORD:-***REMOVED***}
      # postgresql receiver 인증용 — 앱 compose 와 동일한 주입 방식.
      DATABASE_USER: ${DATABASE_USER:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
    # 호스트에서 도는 Redis 에 host.docker.internal 로 접근(앱 컨테이너들과 동일).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./monitoring/otelcol-config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # 호스트 디스크 사용량(hostmetrics filesystem) 수집용 — 루트를 read-only 로 마운트.
      - /:/hostfs:ro
    depends_on:
      - lgtm
    restart: unless-stopped

networks:
  # 이 프로젝트의 default 네트워크를 공유 외부 네트워크로 대체.
  # 앱 서비스(api/celery/web)도 같은 네트워크에 붙어 `lgtm:4318` 로 OTLP 전송한다.
  default:
    external: true
    name: endurohub_obs

volumes:
  lgtm_data:
  # 앱의 nginx 가 기록하는 로그 볼륨을 공유받는다(프로젝트 간 공유 → external).
  nginx_logs:
    external: true
    name: endurohub_nginx_logs
