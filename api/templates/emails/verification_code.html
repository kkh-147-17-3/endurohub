<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>endurohub 이메일 인증</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    {% include "emails/_styles.html" %}
</head>
<body style="margin: 0; padding: 0; width: 100%; background: #F4F4EE; color: #1A2520; font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%;">
    <div style="width: 100%; background: #F4F4EE;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse: collapse; background: #F4F4EE;">
            <tr>
                <td align="center" style="padding: 32px 16px;">
                    <table role="presentation" class="container" width="600" cellpadding="0" cellspacing="0" style="border: 1px solid #1A2520; max-width: 600px; margin: 0 auto; background: #F4F4EE; border-collapse: collapse;">

                        {% include "emails/_header.html" with header_meta="이메일 인증" %}

                        <tr>
                            <td class="hero" style="padding: 44px 32px 32px; border-bottom: 1px solid #1A2520; background: #F4F4EE;">
                                <div style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: #5A6661;">이메일 인증</div>
                                <h1 style="font-family: 'Space Grotesk', 'Helvetica Neue', sans-serif; font-weight: 700; font-size: 36px; letter-spacing: -1.5px; line-height: 1.05; margin: 14px 0 0; color: #1A2520;">인증을<br><em style="font-style: normal; color: #3A8556;">완료해주세요.</em></h1>
                                <p style="margin: 18px 0 0; font-size: 14px; line-height: 1.6; color: #5A6661; font-family: 'Pretendard Variable', Pretendard, -apple-system, sans-serif;">아래 코드를 입력하면 가입이 마무리됩니다.</p>
                            </td>
                        </tr>

                        <tr>
                            <td class="section" style="padding: 36px 32px 28px; border-bottom: 1px solid #1A2520; background: #F4F4EE;">
                                <div style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: #5A6661;">인증 코드</div>
                                <div style="border: 2px solid #1A2520; background: #F4F4EE; padding: 28px 16px; text-align: center; margin-top: 8px;">
                                    <div style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace; font-weight: 600; font-size: 36px; letter-spacing: 14px; color: #1A2520; line-height: 1; padding-left: 14px;">{{ code }}</div>
                                </div>
                                <div style="font-family: 'IBM Plex Mono', Menlo, monospace; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #D14E2C; margin-top: 14px;">10분 유효</div>
                            </td>
                        </tr>

                        <tr>
                            <td class="footer" style="padding: 24px 32px; background: #F4F4EE; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 11px; color: #5A6661;">
                                <div style="font-family: 'Space Grotesk', 'Helvetica Neue', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: -0.3px; color: #1A2520; margin-bottom: 8px;"><span style="display: inline-block; width: 8px; height: 8px; background: #5FB37A; margin-right: 8px; vertical-align: 1px;"></span>endurohub</div>
                                <p style="margin: 4px 0; line-height: 1.6;">본인이 요청하지 않았다면 이 메일을 무시하셔도 됩니다.</p>
                                <p style="margin: 12px 0 4px; line-height: 1.6; opacity: 0.7;">&copy; {% now "Y" %} endurohub</p>
                            </td>
                        </tr>

                    </table>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
