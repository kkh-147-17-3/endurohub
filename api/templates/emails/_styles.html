<style>
    /* Arena Email Visual System — sharp edges, no rounding, crisp lines */
    body, table, td, p, a, li { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; border-collapse: collapse; }
    img { -ms-interpolation-mode: bicubic; border: 0; outline: none; text-decoration: none; display: block; }
    body { margin: 0; padding: 0; width: 100% !important; }

    body {
        font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont,
                     'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        background: #F4F4EE;
        color: #1A2520;
        -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    .wrapper { width: 100%; background: #F4F4EE; }
    .container { max-width: 600px; margin: 0 auto; background: #F4F4EE; }

    .display { font-family: 'Space Grotesk', 'Helvetica Neue', sans-serif; letter-spacing: -0.5px; }
    .mono {
        font-family: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
    }
    .kicker {
        font-family: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
        font-size: 10px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #5A6661;
    }

    /* Header */
    .header {
        padding: 18px 32px;
        border-bottom: 1px solid #1A2520;
        background: #F4F4EE;
    }
    .header-logo {
        font-family: 'Space Grotesk', 'Helvetica Neue', sans-serif;
        font-weight: 700; font-size: 18px;
        letter-spacing: -0.5px;
        color: #1A2520;
    }
    .header-logo-dot {
        display: inline-block;
        width: 8px; height: 8px;
        background: #5FB37A;
        margin-right: 8px;
        vertical-align: 1px;
    }
    .header-meta {
        font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
        font-size: 10px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: #5A6661;
    }

    /* Hero */
    .hero {
        padding: 44px 32px 36px;
        border-bottom: 1px solid #1A2520;
    }
    .hero h1 {
        font-family: 'Space Grotesk', 'Helvetica Neue', sans-serif;
        font-weight: 700;
        font-size: 36px;
        letter-spacing: -1.5px;
        line-height: 1.05;
        margin: 14px 0 0;
        color: #1A2520;
    }
    .hero h1 em { font-style: normal; color: #3A8556; }
    .hero p {
        margin: 18px 0 0;
        font-size: 14px;
        line-height: 1.6;
        color: #5A6661;
    }

    /* Section */
    .section {
        padding: 36px 32px 28px;
        border-bottom: 1px solid #1A2520;
        background: #F4F4EE;
    }
    .section.alt { background: #E8E9DD; }
    .section-title {
        font-family: 'Space Grotesk', 'Helvetica Neue', sans-serif;
        font-weight: 700;
        font-size: 22px;
        letter-spacing: -0.5px;
        color: #1A2520;
        margin: 6px 0 22px;
    }
    .section-title .accent {
        font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
        font-size: 12px;
        letter-spacing: 1.5px;
        color: #D14E2C;
        margin-left: 10px;
    }

    /* Chips */
    .chip {
        display: inline-block;
        padding: 2px 8px;
        border: 1px solid #1A2520;
        font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
        font-size: 11px;
        line-height: 1.5;
        color: #1A2520;
        margin: 2px 4px 2px 0;
        background: transparent;
    }
    .chip.filled { background: #1A2520; color: #F4F4EE; }
    .chip.accent { background: #5FB37A; border-color: #5FB37A; color: #1A2520; }

    /* Race card */
    .race-card {
        border: 1px solid #1A2520;
        background: #F4F4EE;
        margin-bottom: 14px;
    }
    .race-card-head {
        background: #E8E9DD;
        border-bottom: 1px solid #1A2520;
        padding: 8px 14px;
        font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
        font-size: 11px;
        color: #1A2520;
    }
    .race-card-head.urgent {
        background: #D14E2C;
        color: #F4F4EE;
        border-bottom-color: #D14E2C;
    }
    .race-card-head .dday { font-weight: 700; letter-spacing: 0.5px; }
    .race-card-head .code {
        float: right;
        font-size: 10px;
        letter-spacing: 1.5px;
        opacity: 0.8;
    }
    .race-card-img { width: 100%; height: 140px; object-fit: cover; border-bottom: 1px solid #1A2520; }
    .race-card-body { padding: 18px 16px 14px; }
    .race-card-title {
        font-weight: 700;
        font-size: 16px;
        line-height: 1.3;
        letter-spacing: -0.3px;
        margin: 0 0 12px;
        color: #1A2520;
    }
    .race-card-title a { color: #1A2520; }
    .race-card-meta {
        font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
        font-size: 11px;
        color: #5A6661;
        line-height: 1.7;
        margin: 0;
    }
    .race-card-foot {
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid #C5C7BC;
    }

    /* Compact row (table style) */
    .row-table { width: 100%; border-top: 1px solid #1A2520; border-bottom: 1px solid #1A2520; }
    .row-table .col-date { width: 64px; white-space: nowrap; }
    .row-head td {
        background: #E8E9DD;
        padding: 8px 12px;
        font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
        font-size: 10px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: #5A6661;
        border-bottom: 1px solid #1A2520;
    }
    .row td {
        padding: 12px;
        border-bottom: 1px solid #C5C7BC;
        font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
        font-size: 12px;
        color: #5A6661;
        vertical-align: middle;
    }
    .row:last-child td { border-bottom: none; }
    .row .name {
        font-family: 'Pretendard Variable', Pretendard, -apple-system, sans-serif;
        font-weight: 600;
        font-size: 13px;
        color: #1A2520;
    }
    .row .name a { color: #1A2520; }
    .row .dday {
        font-weight: 700;
        color: #1A2520;
        line-height: 1.1;
    }
    .row .dday small {
        display: block;
        font-size: 9px;
        font-weight: 500;
        letter-spacing: 1.5px;
        color: #5A6661;
        margin-bottom: 2px;
    }
    .row .dday.urgent { color: #D14E2C; }
    .row .dday.urgent small { color: #D14E2C; opacity: 0.85; }
    .race-card-head .dday small {
        font-size: 9px;
        font-weight: 500;
        letter-spacing: 1.5px;
        margin-right: 4px;
        opacity: 0.7;
    }

    /* CTA */
    .cta-wrapper {
        text-align: center;
        padding: 28px 32px 36px;
        background: #F4F4EE;
        border-bottom: 1px solid #1A2520;
    }
    .cta-btn {
        display: inline-block;
        background: #1A2520;
        color: #F4F4EE !important;
        font-family: 'Space Grotesk', 'Helvetica Neue', sans-serif;
        font-weight: 600;
        font-size: 13px;
        letter-spacing: -0.2px;
        padding: 13px 22px;
        text-decoration: none;
        border: 1px solid #1A2520;
    }
    .cta-btn .arrow {
        font-family: 'IBM Plex Mono', monospace;
        margin-left: 6px;
    }

    /* Stats strip */
    .stats {
        border-bottom: 1px solid #1A2520;
        background: #F4F4EE;
    }
    .stats td {
        padding: 22px 16px;
        text-align: center;
        border-right: 1px solid #C5C7BC;
        vertical-align: middle;
    }
    .stats td:last-child { border-right: none; }
    .stat-num {
        font-family: 'Space Grotesk', 'Helvetica Neue', sans-serif;
        font-weight: 700;
        font-size: 32px;
        letter-spacing: -1px;
        color: #1A2520;
        line-height: 1;
    }
    .stat-num.urgent { color: #D14E2C; }
    .stat-label {
        font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
        font-size: 10px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: #5A6661;
        margin-top: 6px;
    }

    /* Footer */
    .footer {
        padding: 24px 32px;
        background: #F4F4EE;
        font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
        font-size: 11px;
        color: #5A6661;
    }
    .footer-logo {
        font-family: 'Space Grotesk', 'Helvetica Neue', sans-serif;
        font-weight: 700;
        font-size: 14px;
        letter-spacing: -0.3px;
        color: #1A2520;
        margin-bottom: 8px;
    }
    .footer p { margin: 4px 0; line-height: 1.6; }
    .footer a { color: #1A2520; text-decoration: underline; }

    /* Responsive */
    @media only screen and (max-width: 600px) {
        .container { width: 100% !important; }
        .header, .hero, .section, .cta-wrapper, .footer {
            padding-left: 16px !important;
            padding-right: 16px !important;
        }
        .hero { padding-top: 32px !important; padding-bottom: 28px !important; }
        .hero h1 { font-size: 28px !important; }
        .section-title { font-size: 19px !important; }
        .stats td { padding: 16px 8px !important; }
        .stat-num { font-size: 26px !important; }
        .race-card-img { height: 120px !important; }

        /* Tighten row tables so the name cell gets more space */
        .row-table tr td { padding: 10px 8px !important; }
        .simple-row-table tr td { font-size: 11px !important; }
        .simple-row-table .row .name { font-size: 12px !important; }
        .row-table .col-date { width: 50px !important; padding-right: 10px !important; }
        .row-table tr td.dday { width: 64px !important; padding-left: 10px !important; padding-right: 4px !important; }
    }
</style>
