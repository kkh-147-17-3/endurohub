# 매일 pg_dump → backup-pvc. 기존에 없던 백업 체계 (계획서 Phase 4 요구사항)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: "{{ .Values.images.postgres.repository }}:{{ .Values.images.postgres.tag }}"
              command:
                - sh
                - -c
                - |
                  set -e
                  FILE=/backup/endurohub-$(date +%Y%m%d-%H%M%S).dump
                  pg_dump -Fc -h postgres -U "$PGUSER" "$PGDATABASE" > "$FILE"
                  echo "backup written: $FILE ($(du -h "$FILE" | cut -f1))"
                  find /backup -name 'endurohub-*.dump' -mtime +{{ .Values.backup.retentionDays }} -delete
              env:
                - name: PGUSER
                  value: {{ .Values.appEnv.DATABASE_USER | quote }}
                - name: PGDATABASE
                  value: {{ .Values.appEnv.DATABASE_NAME | quote }}
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: app-secrets
                      key: DATABASE_PASSWORD
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: backup-pvc
