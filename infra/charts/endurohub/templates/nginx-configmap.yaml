# nginx/conf.d/default.conf 를 K8s 용으로 이식한 ConfigMap.
# 변경점은 단 하나: Docker 내장 DNS resolver(127.0.0.11) + set 변수 재해석 트릭 제거.
# K8s 서비스는 ClusterIP 가 안정적이므로 proxy_pass 에 서비스명을 직접 쓴다.
# UA 블랙리스트/JSON 로그/gzip/캐시 헤더는 원본 그대로 유지.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf
data:
  default.conf: |
    # ── 안티크롤링: 악성/공격성 스크래퍼 User-Agent 차단 ──
    map $http_user_agent $ua_blacklisted {
        default                       "";

        # ① SEO 스팸 / 마케팅 데이터 스크래퍼
        "~*AhrefsBot"                 "B";
        "~*SemrushBot"                "B";
        "~*MJ12bot"                   "B";
        "~*DotBot"                    "B";
        "~*BLEXBot"                   "B";
        "~*DataForSeoBot"             "B";
        "~*PetalBot"                  "B";
        "~*SerpstatBot"               "B";
        "~*MegaIndex"                 "B";
        "~*Barkrowler"                "B";
        "~*ZoominfoBot"               "B";
        "~*SeekportBot"               "B";
        "~*magpie-crawler"            "B";
        "~*spbot"                     "B";
        "~*VelenPublicWebCrawler"     "B";
        "~*ImagesiftBot"              "B";

        # ④ abusive AI 크롤러
        "~*Bytespider"               "B";

        # ② 범용 스크래핑 라이브러리 / 자동화 도구
        "~*python-requests"           "B";
        "~*python-urllib"             "B";
        "~*libwww-perl"               "B";
        "~*lwp-trivial"               "B";
        "~*Scrapy"                    "B";
        "~*Go-http-client"            "B";
        "~*Java/"                     "B";
        "~*HTTPie"                    "B";
        "~*aiohttp"                   "B";
        "~*\bcurl/"                   "B";
        "~*\bWget"                    "B";

        # ③ 보안/취약점 스캐너
        "~*masscan"                   "B";
        "~*zgrab"                     "B";
        "~*sqlmap"                    "B";
        "~*nikto"                     "B";
        "~*nuclei"                    "B";
        "~*WPScan"                    "B";
    }

    map $http_authorization $req_has_auth {
        default   "";
        "~.+"     "A";
    }

    map "$ua_blacklisted$req_has_auth" $block_request {
        default   0;
        "B"       1;
    }

    # ── 관측성: JSON 구조화 access log ──
    log_format json_analytics escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"x_forwarded_for":"$http_x_forwarded_for",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent",'
        '"blocked":"$block_request"'
    '}';

    server {
        listen 80 default_server;
        server_name www.endurohub.kr endurohub.kr _;

        access_log /var/log/nginx/access.json json_analytics;
        access_log /dev/stdout;

        if ($block_request) {
            return 403;
        }

        client_max_body_size 20M;

        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 5;
        gzip_min_length 256;
        gzip_types
            application/json
            application/javascript
            application/xml
            application/xml+rss
            application/rss+xml
            application/atom+xml
            application/manifest+json
            application/x-javascript
            application/ld+json
            text/plain
            text/css
            text/html
            text/javascript
            text/xml
            image/svg+xml
            image/x-icon
            font/ttf
            font/otf;

        # Django API
        location /api/ {
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # Django Admin
        location /dj-admin/ {
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Django static files
        location /static/ {
            alias /var/www/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Uploaded media files
        location /storage/ {
            alias /var/www/media/;
            expires 30d;
            add_header Cache-Control "public";
        }

        # SvelteKit immutable assets
        location /_app/immutable/ {
            proxy_pass http://web:3000;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # SvelteKit (all other routes)
        location / {
            proxy_pass http://web:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_http_version 1.1;
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
{{- if .Values.cdn.enabled }}
  cdn.conf: |
    server {
        listen 80;
        server_name cdn.endurohub.kr;

        root /var/www/cdn;
        autoindex off;
        client_max_body_size 1m;

        add_header Cache-Control "public, max-age=3600" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;

        gzip on;
        gzip_vary on;
        gzip_types image/svg+xml application/json text/plain text/css application/javascript;

        location = /healthz.txt {
            try_files $uri =404;
        }

        location / {
            try_files $uri =404;
        }
    }
{{- end }}
