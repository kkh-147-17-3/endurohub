# api / celery-worker / celery-beat 공유 환경변수 (비밀 아님)
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-env
data:
{{- range $k, $v := .Values.appEnv }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
---
# web (SvelteKit) 환경변수 (비밀 아님)
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-env
data:
{{- range $k, $v := .Values.webEnv }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
