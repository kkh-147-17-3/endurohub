{{- if .Values.secrets.create }}
# 로컬 리허설 전용 — 프로덕션에서는 secrets.create=false 로 두고
# 동일 이름(app-secrets)의 Secret 을 kubectl 로 직접 생성한다 (git 에 비밀값 금지).
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
stringData:
{{- range $k, $v := .Values.secrets.data }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
{{- end }}
