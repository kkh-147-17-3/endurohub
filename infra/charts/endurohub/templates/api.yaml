apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # 이미지 빌드 시 collectstatic 결과물은 PVC 마운트에 가려지므로,
        # 기동 시 PVC(/app/staticfiles)로 다시 수집한다 (compose 의 api_static 볼륨 역할)
        - name: collectstatic
          image: "{{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          command: ["python", "manage.py", "collectstatic", "--noinput"]
          envFrom:
            - configMapRef:
                name: app-env
            - secretRef:
                name: app-secrets
          volumeMounts:
            - name: static
              mountPath: /app/staticfiles
      containers:
        - name: api
          image: "{{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          command:
            {{- toYaml .Values.api.command | nindent 12 }}
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: app-env
            - secretRef:
                name: app-secrets
          volumeMounts:
            - name: static
              mountPath: /app/staticfiles
            - name: media
              mountPath: /app/storage
          # gunicorn 프로세스가 살아있어도 응답 불능이면 재시작 (compose 에는 없던 기능)
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          # DB 연결까지 실제로 동작해야 트래픽을 받는다.
          # kubelet 은 파드 IP 를 Host 헤더로 보내므로 ALLOWED_HOSTS 에 있는 값을 명시한다.
          readinessProbe:
            httpGet:
              path: /api/v1/races/
              port: 8000
              httpHeaders:
                - name: Host
                  value: api
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - name: static
          persistentVolumeClaim:
            claimName: static-pvc
        - name: media
          persistentVolumeClaim:
            claimName: media-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
