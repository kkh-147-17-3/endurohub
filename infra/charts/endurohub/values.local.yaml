# k3d 로컬 리허설 전용 오버라이드
# 사용: helm upgrade --install endurohub ./infra/charts/endurohub -n endurohub -f infra/charts/endurohub/values.local.yaml

appEnv:
  DJANGO_DEBUG: "false"          # 프로덕션과 동일 조건으로 리허설
  DJANGO_ALLOWED_HOSTS: "localhost,api,nginx"
  DATABASE_HOST: "postgres"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "endurohub"
  DATABASE_USER: "enduro"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  DEFAULT_FROM_EMAIL: "contact@endurohub.kr"
  CRAWL_REPORT_EMAIL: "kkh147.17.3@gmail.com"
  CRAWL_SEND_EMPTY_REPORT: "false"
  LLM_PROVIDER: "openai"
  LLM_BASE_URL: "https://api.openai.com/v1"
  LLM_MODEL: ""
  LLM_JSON_MODE: ""
  OTEL_SDK_DISABLED: "true"

webEnv:
  API_URL_INTERNAL: "http://api:8000"
  PUBLIC_API_URL: "/api"
  PUBLIC_APP_URL: "http://localhost:8080"   # k3d 포트포워딩 기준
  PUBLIC_KAKAO_JAVASCRIPT_KEY: ""
  PUBLIC_NAVER_MAP_CLIENT_ID: ""
  PUBLIC_GOOGLE_ANALYTICS_ID: ""
  PUBLIC_POSTHOG_KEY: ""
  PUBLIC_POSTHOG_HOST: "https://us.i.posthog.com"
  PUBLIC_FEEDBACK_FORM_URL: ""
  BODY_SIZE_LIMIT: "20971520"
  OTEL_SDK_DISABLED: "true"

# 로컬은 git 에 올라가도 무해한 더미 비밀값으로 Secret 을 차트가 직접 생성
secrets:
  create: true
  data:
    DATABASE_PASSWORD: "localdev"
    DJANGO_SECRET_KEY: "local-dev-secret-key-not-for-production"
    REDIS_PASSWORD: "localdev"
    ADMIN_SECRET: "local-admin-secret"
    CRAWLER_API_KEY: ""
    SLACK_BOT_USER_OAUTH_TOKEN: ""
    SENTRY_DSN: ""
    SENTRY_DSN_WEB: ""
    KAKAO_CLIENT_ID: ""
    KAKAO_CLIENT_SECRET: ""
    NAVER_CLIENT_ID: ""
    NAVER_CLIENT_SECRET: ""
    GOOGLE_CLIENT_ID: ""
    GOOGLE_CLIENT_SECRET: ""
    EMAIL_HOST_USER: ""
    EMAIL_HOST_PASSWORD: ""
    LLM_API_KEY: ""
    OPENAI_API_KEY: ""

# 로컬 노트북 RAM 보호 — 리허설엔 낮은 상한으로 충분
api:
  resources:
    limits:
      memory: 768Mi
web:
  resources:
    limits:
      memory: 512Mi
celeryWorker:
  resources:
    limits:
      memory: 512Mi
crawler:
  # Playwright 이미지 빌드가 오래 걸리므로 처음엔 0 으로 두고,
  # 이미지 준비 후 --set crawler.replicas=1 로 켠다
  replicas: 0

postgres:
  storage: 2Gi
redis:
  storage: 512Mi
storage:
  static: 512Mi
  media: 1Gi
  backup: 1Gi

cdn:
  enabled: false   # hostPath(/home/kkh/public)는 서버 전용
