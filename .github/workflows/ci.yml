name: CI

on:
  pull_request:
    paths:
      - 'api/**'
      - '.github/workflows/ci.yml'
  push:
    branches-ignore: [master]
    paths:
      - 'api/**'
      - '.github/workflows/ci.yml'

jobs:
  django-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Django system checks
        run: python manage.py check --fail-level WARNING

  postgres-migrations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ci-only-disposable-postgres-migration-validation-secret
      DJANGO_DEBUG: 'false'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: '5432'
      DATABASE_NAME: endurohub_migration_ci
      DATABASE_USER: endurohub_migration_ci
      DATABASE_PASSWORD: disposable_migration_ci_password
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ''
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: endurohub_migration_ci
          POSTGRES_USER: endurohub_migration_ci
          POSTGRES_PASSWORD: disposable_migration_ci_password
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U endurohub_migration_ci -d endurohub_migration_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - '127.0.0.1:6379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply real migrations to disposable PostgreSQL
        run: python manage.py migrate --noinput

      - name: Run Django system checks against PostgreSQL
        run: python manage.py check --fail-level WARNING

  mypy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt

      - name: Install dependencies (incl. dev)
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run mypy (strict)
        run: mypy .

      - name: Run API regression tests
        run: pytest -q
