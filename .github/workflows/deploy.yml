name: Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    steps:
      - name: Pull latest code
        working-directory: ${{ vars.DEPLOY_PATH }}
        run: |
          git stash --include-untracked || true
          git pull origin master
          git stash pop || true

      - name: Detect changes
        id: changes
        working-directory: ${{ vars.DEPLOY_PATH }}
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          echo "$CHANGED"

          echo "api=false" >> $GITHUB_OUTPUT
          echo "web=false" >> $GITHUB_OUTPUT
          echo "infra=false" >> $GITHUB_OUTPUT

          if echo "$CHANGED" | grep -q "^api/"; then
            echo "api=true" >> $GITHUB_OUTPUT
          fi
          if echo "$CHANGED" | grep -q "^web/"; then
            echo "web=true" >> $GITHUB_OUTPUT
          fi
          if echo "$CHANGED" | grep -qE "^(nginx/|docker-compose\.yml)"; then
            echo "infra=true" >> $GITHUB_OUTPUT
          fi

      - name: Rebuild all (infra changed)
        if: steps.changes.outputs.infra == 'true'
        working-directory: ${{ vars.DEPLOY_PATH }}
        run: docker compose up -d --build

      - name: Rebuild api only
        if: steps.changes.outputs.infra == 'false' && steps.changes.outputs.api == 'true'
        working-directory: ${{ vars.DEPLOY_PATH }}
        run: docker compose up -d --build api

      - name: Rebuild web only
        if: steps.changes.outputs.infra == 'false' && steps.changes.outputs.web == 'true'
        working-directory: ${{ vars.DEPLOY_PATH }}
        run: docker compose up -d --build web

      - name: Verify services
        working-directory: ${{ vars.DEPLOY_PATH }}
        run: |
          sleep 5
          docker compose ps
          curl -sf http://localhost/api/v1/races/ > /dev/null && echo "API OK" || echo "API FAIL"
          curl -sf http://localhost/ > /dev/null && echo "Web OK" || echo "Web FAIL"
