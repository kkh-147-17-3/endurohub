name: Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    steps:
      - name: Pull latest code
        working-directory: ${{ vars.DEPLOY_PATH }}
        # 배포는 커밋 상태 그대로 반영한다. stash/pop 은 파일 재구성 시 충돌 마커를 남겨
        # docker compose 를 깨뜨릴 수 있어 fetch + reset --hard 로 대체.
        # (reset --hard 는 추적 파일만 되돌리고 .env 등 untracked 파일은 보존)
        run: |
          git fetch origin master
          git reset --hard origin/master

      # 앱↔관측성 공유 네트워크/볼륨을 보장한다(이미 있으면 무시). 앱 compose 가
      # 이 둘을 external 로 참조하므로 어느 compose 든 up 전에 존재해야 한다.
      - name: Bootstrap shared network/volume
        working-directory: ${{ vars.DEPLOY_PATH }}
        run: |
          docker network create endurohub_obs 2>/dev/null || true
          docker volume create endurohub_nginx_logs 2>/dev/null || true

      - name: Detect changes
        id: changes
        working-directory: ${{ vars.DEPLOY_PATH }}
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          echo "$CHANGED"

          echo "api=false" >> $GITHUB_OUTPUT
          echo "web=false" >> $GITHUB_OUTPUT
          echo "infra=false" >> $GITHUB_OUTPUT
          echo "obs=false" >> $GITHUB_OUTPUT

          if echo "$CHANGED" | grep -q "^api/"; then
            echo "api=true" >> $GITHUB_OUTPUT
          fi
          if echo "$CHANGED" | grep -q "^web/"; then
            echo "web=true" >> $GITHUB_OUTPUT
          fi
          if echo "$CHANGED" | grep -qE "^(nginx/|docker-compose\.yml)"; then
            echo "infra=true" >> $GITHUB_OUTPUT
          fi
          # 관측성 스택은 앱과 독립 배포(앱 재빌드 없이 관측성만 갱신).
          if echo "$CHANGED" | grep -qE "^(monitoring/|docker-compose\.observability\.yml)"; then
            echo "obs=true" >> $GITHUB_OUTPUT
          fi

      - name: Rebuild all (infra changed)
        if: steps.changes.outputs.infra == 'true'
        working-directory: ${{ vars.DEPLOY_PATH }}
        # --remove-orphans: 분리 이전 app 프로젝트에 남아있던 관측성 컨테이너(lgtm 등)를 정리
        # → 새 endurohub-obs 프로젝트의 lgtm 과 3001 포트 충돌 방지.
        run: docker compose up -d --build --remove-orphans

      - name: Rebuild api only
        if: steps.changes.outputs.infra == 'false' && steps.changes.outputs.api == 'true'
        working-directory: ${{ vars.DEPLOY_PATH }}
        run: docker compose up -d --build api

      - name: Rebuild web only
        if: steps.changes.outputs.infra == 'false' && steps.changes.outputs.web == 'true'
        working-directory: ${{ vars.DEPLOY_PATH }}
        run: docker compose up -d --build web

      # 관측성 스택은 앱과 별도로 배포한다. mounted config(알림 규칙/otelcol/promtail)
      # 변경은 컨테이너 재생성으로만 반영되므로 --force-recreate 로 강제 갱신한다.
      - name: Deploy observability (obs changed)
        if: steps.changes.outputs.obs == 'true'
        working-directory: ${{ vars.DEPLOY_PATH }}
        run: docker compose -f docker-compose.observability.yml up -d --force-recreate

      - name: Run migrations
        if: steps.changes.outputs.api == 'true' || steps.changes.outputs.infra == 'true'
        working-directory: ${{ vars.DEPLOY_PATH }}
        run: docker compose exec -T api python manage.py migrate --noinput --fake-initial

      - name: Verify services
        working-directory: ${{ vars.DEPLOY_PATH }}
        run: |
          sleep 5
          docker compose ps
          curl -sf http://localhost/api/v1/races/ > /dev/null && echo "API OK" || echo "API FAIL"
          curl -sf http://localhost/ > /dev/null && echo "Web OK" || echo "Web FAIL"
