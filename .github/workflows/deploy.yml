name: Deploy

on:
  push:
    branches: [master]

# 동시에 여러 배포가 겹치지 않도록(연속 push 시 최신 것만 실행)
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          envs: DEPLOY_PATH
          command_timeout: 30m
          # 원격 서버에서 실행되는 배포 스크립트. self-hosted 시절 각 step 을
          # 하나의 bash 스크립트로 합친 것(로직은 동일).
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"

            # 1) 커밋 상태 그대로 반영 (untracked .env 등은 보존)
            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "Tracked server changes found; deployment stopped without resetting them." >&2
              git diff --name-only
              git diff --cached --name-only
              exit 1
            fi
            BEFORE=$(git rev-parse HEAD)
            git fetch origin master
            git reset --hard origin/master
            AFTER=$(git rev-parse HEAD)

            # 2) 앱↔관측성 공유 네트워크/볼륨 보장
            docker network create endurohub_obs 2>/dev/null || true
            docker volume create endurohub_nginx_logs 2>/dev/null || true

            # 3) 변경 감지 — 직전 배포 커밋(BEFORE)부터 지금까지 전부 본다.
            #    HEAD~1..HEAD 로 보면 한 번에 여러 커밋이 push 될 때 마지막 커밋의
            #    경로만 잡혀 나머지 커밋이 건드린 서비스가 조용히 누락된다
            #    (실제로 crawler/ 수정이 배포된 척하고 옛 이미지로 계속 돌았다).
            if [ "$BEFORE" = "$AFTER" ]; then
              CHANGED=$(git diff --name-only HEAD~1 HEAD)   # 재실행: 마지막 커밋 기준
            else
              CHANGED=$(git diff --name-only "$BEFORE" "$AFTER")
            fi
            echo "$CHANGED"
            API=false; WEB=false; CRAWLER=false; INFRA=false; OBS=false
            echo "$CHANGED" | grep -q "^api/" && API=true || true
            echo "$CHANGED" | grep -q "^web/" && WEB=true || true
            echo "$CHANGED" | grep -q "^crawler/" && CRAWLER=true || true
            echo "$CHANGED" | grep -qE "^(nginx/|docker-compose\.yml)" && INFRA=true || true
            echo "$CHANGED" | grep -qE "^(monitoring/|docker-compose\.observability\.yml)" && OBS=true || true

            # 4) 먼저 이미지만 빌드한다. 실패 시 기존 컨테이너를 그대로 두고 중단한다.
            SERVICES=()
            if [ "$API" = true ]; then
              SERVICES+=(api celery-worker celery-beat)
            fi
            if [ "$WEB" = true ]; then
              SERVICES+=(web)
            fi
            if [ "$CRAWLER" = true ]; then
              SERVICES+=(crawler-worker)
            fi
            if [ "$INFRA" = true ]; then
              docker compose build
            elif [ "${#SERVICES[@]}" -gt 0 ]; then
              docker compose build "${SERVICES[@]}"
            fi

            # 5) 새 API 이미지의 일회성 컨테이너로 마이그레이션한다.
            # 신규 컬럼/테이블을 쓰는 API·워커를 먼저 시작하지 않는다.
            if [ "$API" = true ] || [ "$INFRA" = true ]; then
              MIGRATION_PLAN=$(docker compose run --rm --no-deps -T api python manage.py showmigrations --plan)
              printf '%s\n' "$MIGRATION_PLAN"
              if printf '%s\n' "$MIGRATION_PLAN" | grep '^\[ \]' > /dev/null; then
                bash scripts/deploy-db-backup.sh "$PWD/.deploy-backups" "$AFTER"
                umask 077
                {
                  printf 'Previous commit: %s\nNext commit: %s\n' "$BEFORE" "$AFTER"
                  docker compose images
                } > "$PWD/.deploy-backups/rollout-${AFTER}.txt"
              fi
              docker compose run --rm --no-deps -T -e PGOPTIONS='-c lock_timeout=10s -c statement_timeout=300s' api python manage.py migrate --noinput
            fi

            # 6) 빌드와 DB 준비가 모두 성공한 뒤 관련 서비스만 교체한다.
            # celery-worker/beat 도 api 코드가 바뀌면 반드시 새 이미지로 시작한다.
            if [ "$INFRA" = true ]; then
              docker compose up -d --no-build --remove-orphans
            elif [ "${#SERVICES[@]}" -gt 0 ]; then
              docker compose up -d --no-build --no-deps "${SERVICES[@]}"
            fi

            # 관측성 스택은 앱과 독립 배포 (mounted config 반영 위해 force-recreate)
            if [ "$OBS" = true ]; then
              docker compose -f docker-compose.observability.yml up -d --force-recreate
            fi

            # 7) 검증 — 실패하면 워크플로도 실패해야 한다.
            # nginx 안티크롤러가 `curl/` UA 를 403 차단하므로(default.conf) 헬스체크는
            # 블랙리스트에 없는 UA 로 요청해야 실제 200 을 확인할 수 있다.
            sleep 5
            docker compose ps
            docker compose exec -T api python manage.py migrate --check
            docker compose exec -T api python manage.py showmigrations races accounts
            UA="Mozilla/5.0 (deploy-healthcheck)"
            curl -fsS --max-time 10 --retry 5 --retry-delay 3 --retry-connrefused -A "$UA" http://localhost/api/v1/races/ > /dev/null
            echo "API OK"
            curl -fsS --max-time 10 --retry 5 --retry-delay 3 --retry-connrefused -A "$UA" http://localhost/ > /dev/null
            echo "Web OK"
