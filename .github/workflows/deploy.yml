name: Deploy

on:
  push:
    branches: [master]

# 동시에 여러 배포가 겹치지 않도록(연속 push 시 최신 것만 실행)
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          # 원격 서버에서 실행되는 배포 스크립트. self-hosted 시절 각 step 을
          # 하나의 bash 스크립트로 합친 것(로직은 동일).
          script: |
            set -euo pipefail
            cd "${{ vars.DEPLOY_PATH }}"

            # 1) 커밋 상태 그대로 반영 (untracked .env 등은 보존)
            git fetch origin master
            git reset --hard origin/master

            # 2) 앱↔관측성 공유 네트워크/볼륨 보장
            docker network create endurohub_obs 2>/dev/null || true
            docker volume create endurohub_nginx_logs 2>/dev/null || true

            # 3) 변경 감지
            CHANGED=$(git diff --name-only HEAD~1 HEAD)
            echo "$CHANGED"
            API=false; WEB=false; INFRA=false; OBS=false
            echo "$CHANGED" | grep -q "^api/" && API=true || true
            echo "$CHANGED" | grep -q "^web/" && WEB=true || true
            echo "$CHANGED" | grep -qE "^(nginx/|docker-compose\.yml)" && INFRA=true || true
            echo "$CHANGED" | grep -qE "^(monitoring/|docker-compose\.observability\.yml)" && OBS=true || true

            # 4) 재빌드 (infra 변경 시 전체 / 아니면 변경된 서비스만)
            if [ "$INFRA" = true ]; then
              docker compose up -d --build --remove-orphans
            else
              [ "$API" = true ] && docker compose up -d --build api || true
              [ "$WEB" = true ] && docker compose up -d --build web || true
            fi

            # 관측성 스택은 앱과 독립 배포 (mounted config 반영 위해 force-recreate)
            if [ "$OBS" = true ]; then
              docker compose -f docker-compose.observability.yml up -d --force-recreate
            fi

            # 5) 마이그레이션
            if [ "$API" = true ] || [ "$INFRA" = true ]; then
              docker compose exec -T api python manage.py migrate --noinput --fake-initial
            fi

            # 6) 검증
            # nginx 안티크롤러가 `curl/` UA 를 403 차단하므로(default.conf) 헬스체크는
            # 블랙리스트에 없는 UA 로 요청해야 실제 200 을 확인할 수 있다.
            sleep 5
            docker compose ps
            UA="Mozilla/5.0 (deploy-healthcheck)"
            curl -sf -A "$UA" http://localhost/api/v1/races/ > /dev/null && echo "API OK" || echo "API FAIL"
            curl -sf -A "$UA" http://localhost/ > /dev/null && echo "Web OK" || echo "Web FAIL"
