name: Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    steps:
      - name: Pull latest code
        working-directory: ${{ vars.DEPLOY_PATH }}
        run: |
          git stash --include-untracked || true
          git pull origin master
          git stash pop || true

      - name: Rebuild and restart
        working-directory: ${{ vars.DEPLOY_PATH }}
        run: docker compose up -d --build

      - name: Verify services
        working-directory: ${{ vars.DEPLOY_PATH }}
        run: |
          sleep 5
          docker compose ps
          curl -sf http://localhost/api/v1/races/ > /dev/null && echo "API OK" || echo "API FAIL"
          curl -sf http://localhost/ > /dev/null && echo "Web OK" || echo "Web FAIL"
