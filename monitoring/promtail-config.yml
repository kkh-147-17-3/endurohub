# promtail — nginx JSON access log 을 tail 해서 Loki(LGTM 올인원의 3100 포트)로 push.
# 앱(api/celery/web) 로그는 OTLP 로 직접 전송하므로 여기서는 nginx 만 담당한다.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://lgtm:3100/loki/api/v1/push

scrape_configs:
  - job_name: nginx
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          service_name: endurohub-nginx
          __path__: /var/log/nginx/*.json
    pipeline_stages:
      - json:
          expressions:
            status: status
      - labels:
          status:
