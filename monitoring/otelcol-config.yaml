# OpenTelemetry Collector — 컨테이너 + 호스트 리소스 메트릭 수집기.
#  - docker_stats: 컨테이너별 CPU/메모리/네트워크/블록IO (Docker 소켓)
#  - hostmetrics : 호스트 디스크 사용량(파일시스템) — 디스크 풀 → 앱 다운 위험 자동 감지
#  - redis       : 호스트 Redis 의 INFO(메모리/연결/명령/hit-miss 등) — OTLP 로 변환
#  - postgresql  : 호스트 PostgreSQL 서버 메트릭(연결/트랜잭션/캐시 hit/용량 등) — OTLP 로 변환
# 모두 OTLP 로 lgtm 에 전송한다.
receivers:
  # 호스트에서 도는 Redis(앱과 동일하게 host.docker.internal 로 접근)를 주기적으로 INFO 스크랩.
  # 비밀번호는 compose 에서 REDIS_PASSWORD 환경변수로 주입한다.
  redis:
    endpoint: "host.docker.internal:6379"
    password: "${env:REDIS_PASSWORD}"
    collection_interval: 15s

  # 호스트 PostgreSQL 의 서버 통계(pg_stat_*)를 주기적으로 수집.
  # 자격증명은 compose 에서 DATABASE_USER/DATABASE_PASSWORD 환경변수로 주입.
  postgresql:
    endpoint: "host.docker.internal:5432"
    username: "${env:DATABASE_USER}"
    password: "${env:DATABASE_PASSWORD}"
    databases: [endurohub]
    tls:
      insecure: true   # 호스트 내부 연결 — TLS 미사용.
    collection_interval: 30s

  docker_stats:
    endpoint: unix:///var/run/docker.sock
    collection_interval: 15s
    # compose 서비스 이름을 메트릭 라벨(compose_service)로 노출 → 컨테이너별 그룹핑 쿼리에 사용.
    container_labels_to_metric_labels:
      com.docker.compose.service: compose_service

  hostmetrics:
    # 호스트 루트를 /hostfs 에 read-only 로 마운트하고 root_path 로 알려준다(컨테이너 내부가 아닌 호스트 디스크를 읽기 위함).
    root_path: /hostfs
    collection_interval: 30s
    scrapers:
      filesystem:
        # 가상 파일시스템(tmpfs/overlay 등)은 기본 제외됨(include_virtual_filesystems: false).
        metrics:
          system.filesystem.utilization:  # 0~1 사용률(기본 비활성) — 디스크 풀 알림에 직접 사용.
            enabled: true

processors:
  batch: {}

exporters:
  otlphttp:
    endpoint: http://lgtm:4318

service:
  pipelines:
    metrics:
      receivers: [docker_stats, hostmetrics, redis, postgresql]
      processors: [batch]
      exporters: [otlphttp]
  telemetry:
    logs:
      level: info
