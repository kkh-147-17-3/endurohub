# Grafana 알림 수신처 — Telegram(기존 에러알림 채널 재사용).
# 토큰/챗ID 는 lgtm 컨테이너 환경변수에서 주입(${...} = Grafana 의 env 보간).
apiVersion: 1

contactPoints:
  - orgId: 1
    name: Telegram
    receivers:
      - uid: telegram_ehub
        type: telegram
        settings:
          bottoken: ${TELEGRAM_BOT_TOKEN}
          # chatid 는 정수형이라 ${VAR}/$__env{} 보간 시 Grafana 가 JSON number 로
          # 파싱해 "cannot unmarshal number into ... chatid of type string" 로 부팅 실패한다.
          # 정적 문자열 리터럴은 타입 변환을 타지 않으므로 직접 기입한다(시크릿은 bottoken 뿐).
          chatid: "8581246573"
        disableResolveMessage: false
