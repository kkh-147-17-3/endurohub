# ── 안티크롤링: 악성/공격성 스크래퍼 User-Agent 차단 ─────────────────────────
# 정책: 검색엔진(Googlebot/Bingbot/네이버 Yeti/Daum 등)과 AI 크롤러
#       (GPTBot/ClaudeBot/PerplexityBot/CCBot 등)는 SEO·AI 노출을 위해 허용한다.
#       이들은 아래 블랙리스트에 없으므로 그대로 통과한다(= 화이트리스트가 아닌 블랙리스트 방식).
# 차단 대상: ① SEO 스팸/마케팅 스크래퍼  ② 범용 스크래핑 라이브러리  ③ 보안 스캐너
#           ④ robots.txt를 무시하는 abusive AI 크롤러(Bytespider).
map $http_user_agent $ua_blacklisted {
    default                       "";

    # ① SEO 스팸 / 마케팅 데이터 스크래퍼 (자사 SEO에 도움 안 됨, 리소스만 소모)
    "~*AhrefsBot"                 "B";
    "~*SemrushBot"                "B";
    "~*MJ12bot"                   "B";
    "~*DotBot"                    "B";
    "~*BLEXBot"                   "B";
    "~*DataForSeoBot"             "B";
    "~*PetalBot"                  "B";
    "~*SerpstatBot"               "B";
    "~*MegaIndex"                 "B";
    "~*Barkrowler"                "B";
    "~*ZoominfoBot"               "B";
    "~*SeekportBot"               "B";
    "~*magpie-crawler"            "B";
    "~*spbot"                     "B";
    "~*VelenPublicWebCrawler"     "B";
    "~*ImagesiftBot"              "B";

    # ④ abusive AI 크롤러 (robots.txt 무시로 악명, 기존 robots.txt에서도 차단)
    "~*Bytespider"               "B";

    # ② 범용 스크래핑 라이브러리 / 자동화 도구 (정상 브라우저 UA에는 등장하지 않음)
    "~*python-requests"           "B";
    "~*python-urllib"             "B";
    "~*libwww-perl"               "B";
    "~*lwp-trivial"               "B";
    "~*Scrapy"                    "B";
    "~*Go-http-client"            "B";
    "~*Java/"                     "B";
    "~*HTTPie"                    "B";
    "~*aiohttp"                   "B";
    "~*\bcurl/"                   "B";
    "~*\bWget"                    "B";

    # ③ 보안/취약점 스캐너
    "~*masscan"                   "B";
    "~*zgrab"                     "B";
    "~*sqlmap"                    "B";
    "~*nikto"                     "B";
    "~*nuclei"                    "B";
    "~*WPScan"                    "B";
}

# 자체 크롤러(이미지 업로드 등)는 `Authorization: Bearer <KEY>` 헤더로 인증한다.
# 인증 헤더가 있으면 차단 예외 처리하여 자사 크롤러가 막히지 않게 한다.
map $http_authorization $req_has_auth {
    default   "";
    "~.+"     "A";
}

# 블랙리스트 UA(B)이면서 인증 헤더가 없을 때만 차단한다. 인증이 있으면("BA") 통과.
map "$ua_blacklisted$req_has_auth" $block_request {
    default   0;
    "B"       1;
}

# ── 관측성: JSON 구조화 access log (promtail → Loki 로 수집) ──────────────────
# escape=json 으로 따옴표/제어문자를 안전하게 이스케이프한다. blocked 필드로
# 안티크롤러 403 차단 현황을 Grafana 에서 집계할 수 있다.
log_format json_analytics escape=json '{'
    '"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"x_forwarded_for":"$http_x_forwarded_for",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"body_bytes":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_time":"$upstream_response_time",'
    '"referer":"$http_referer",'
    '"user_agent":"$http_user_agent",'
    '"blocked":"$block_request"'
'}';

server {
    listen 80 default_server;
    server_name www.endurohub.kr endurohub.kr _;

    # access log: JSON은 파일(promtail 수집), combined는 stdout(docker logs) 으로 동시 기록
    access_log /var/log/nginx/access.json json_analytics;
    access_log /dev/stdout;

    # 악성/공격성 크롤러 차단 (검색엔진·AI 봇은 블랙리스트에 없어 통과)
    if ($block_request) {
        return 403;
    }

    # ── http:// 를 https:// 로 301 ───────────────────────────────────────────────
    # cloudflared 는 항상 평문으로 오리진에 붙으므로 $scheme 은 늘 "http" 다.
    # 실제 클라이언트 스킴은 Cloudflare 엣지가 붙여주는 X-Forwarded-Proto 로만 알 수 있다.
    # 이게 없으면 http/https 두 벌의 사이트가 동시에 200을 반환해 색인이 중복된다.
    # 헤더가 없는 요청(로컬 헬스체크, 컨테이너 간 호출)은 조건에 걸리지 않아 그대로 통과한다.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # Docker internal DNS – re-resolve on every request
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 20M;

    # Gzip compression — reduces bytes sent through the cloudflared tunnel.
    # Cloudflare's edge re-compresses with brotli for end users, but compressing
    # here cuts upload-bandwidth pressure on the home ISP.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/rss+xml
        application/atom+xml
        application/manifest+json
        application/x-javascript
        application/ld+json
        text/plain
        text/css
        text/html
        text/javascript
        text/xml
        image/svg+xml
        image/x-icon
        font/ttf
        font/otf;

    # Django API
    location /api/ {
        set $django http://api:8000;
        proxy_pass $django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Django Admin (moved from /admin/ — that path now belongs to the SvelteKit admin UI)
    location /dj-admin/ {
        set $django http://api:8000;
        proxy_pass $django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django static files (collected via collectstatic)
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Uploaded media files (Django MEDIA_URL = /storage/)
    location /storage/ {
        alias /var/www/media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # SvelteKit immutable assets (_app/immutable/)
    location /_app/immutable/ {
        set $sveltekit http://web:3000;
        proxy_pass $sveltekit;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SvelteKit (all other routes)
    location / {
        set $sveltekit http://web:3000;
        proxy_pass $sveltekit;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }
}
