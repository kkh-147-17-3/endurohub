server {
    listen 80;
    server_name _;

    # Docker internal DNS – re-resolve on every request
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 20M;

    # Django API
    location /api/ {
        set $django http://api:8000;
        proxy_pass $django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Django Admin (moved from /admin/ — that path now belongs to the SvelteKit admin UI)
    location /dj-admin/ {
        set $django http://api:8000;
        proxy_pass $django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django static files (collected via collectstatic)
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Uploaded media files (Django MEDIA_URL = /storage/)
    location /storage/ {
        alias /var/www/media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # SvelteKit immutable assets (_app/immutable/)
    location /_app/immutable/ {
        set $sveltekit http://web:3000;
        proxy_pass $sveltekit;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SvelteKit (all other routes)
    location / {
        set $sveltekit http://web:3000;
        proxy_pass $sveltekit;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }
}
